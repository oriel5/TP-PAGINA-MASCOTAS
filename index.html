<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagina Mascota</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <img src="Imágenes/logo.png" alt="Logo">

            <nav>
                <a href="#">Lorem</a>
                <a href="#">Lorem</a>
            </nav>

        </header>

        <section class="mascota">
            
            <div class="bienvenido">Bienvenidos!</div>
            <img src="Imágenes/imagen.png" alt="Mascotas">
            
            <h1>Mascotas</h1>

            <button class="btn-top">INGRESAR MASCOTA</button>

            <div class="form-container">
                <form>
                    <label>Mascota*</label>

                    <div class="radio-group">
                        <label>
                            <input type="radio" name="mascota" required>
                            Gato

                        </label>
                        
                        <label>
                            <input type="radio" name="mascota" required>
                            Perro
                        </label> 
                    </div>

                    <div class="campo">
                        <label>Nombre*</label>
                        <input type="text" required>
                    </div>

                    <div class="campo">
                        <label>Apodo*</label>
                        <input type="text" required>
                    </div>

                    <div class="campo">
                        <label>Edad aproximada*</label>
                        <input type="text" required>
                    </div>

                    <div class="campo">
                        <label>Sexo</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Descripción física*</label>
                        <input type="text" required>
                    </div>

                    <div class="campo">
                        <label>Caracteristicas</label>
                    
                        <select>
                            
                            <option>Color principal</option>
                            <option value="negro">Negro</option>
                            <option value="gris">Gris</option>
                            <option value="blanco">Blanco</option>
                            <option value="marron">Marron</option>
                            <option value="naranja">Naranja</option>
                            
                        </select>
                    </div>

                    <div class="campo">
                        <label>Ingresar caracteristicas</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Fotos</label>

                        <div class="file-box">
                            <label for="foto">Seleccionar archivo</label>
                            <input type="file" id="foto">
                            <span class="file-name">No se eligió archivo</span>
                        </div>

                    </div>

                    <div class="btn-container">
                        <button class="btn-save">GUARDAR</button>
                    </div>

                </form>



            </div>


        
        </section>


        <footer>
            <h1>footer moment</h1>    

        </footer>

    </body>

</html>
